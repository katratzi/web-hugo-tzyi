name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Serialize deployments so an older upload cannot overwrite a newer one.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hugo-build-deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out site
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          # Match the tested local version; upgrade deliberately, not via latest.
          hugo-version: '0.164.0'
          extended: true

      - name: Build
        timeout-minutes: 1
        run: |
          hugo version
          timeout --signal=KILL 30s hugo --minify --logLevel info --printPathWarnings

      - name: Sync files
        timeout-minutes: 1
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: server27.shared.spaceship.host
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          local-dir: ./public/
