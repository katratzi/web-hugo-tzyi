baseURL: https://www.tzyi.dev
locale: en-US
title: TZYI
theme: "PaperMod"
pluralizelisttitles: false
outputs:
    home:
        - HTML
        - RSS
        - JSON # is necessary

# Disable minification for XML/JSON to avoid very slow builds (RSS/JSON minify is a known bottleneck)
minify:
  disableXML: true
  disableJSON: true

staticDir:
    - static

# allow me to add custom html tags into text
markup:
  goldmark:
    renderer:
      unsafe: true

menu:
  main:
    # - identifier: categories
    #   name: categories
    #   url: /categories/
    #   weight: 10
    - identifier: about
      name: about
      url: /who/about
      weight: 1
    - identifier: apps
      name: ios apps
      url: /apps/
      weight: 10
    # - identifier: archives
    #   name: archive
    #   url: /archives/
    #   weight: 21
    - identifier: posts
      name: posts
      url: /posts/
      weight: 20
    - identifier: tags
      name: tags
      url: /tags/
      weight: 30
    # - identifier: example
    #   name: example.org
    #   url: https://example.org
    #   weight: 30

params:
  # Required for RSS; avoids deprecated site.Author (removed in Hugo 0.156+)
  author: TzYi
  hideAuthor: true
  ShowBreadCrumbs: true
  # ShowShareButtons: true
  defaultTheme: auto
  ShowFullTextinRSS: true
  mainSections:
    - posts

  # working home-info mode
  homeInfoParams:
    Title: "Join me as I make wee wonderful apps"
    Content: >
            Welcome to **TzYi**, my little corner of the web. I'm a solo developer based in Scotland,
            mostly focused on **iOS apps** with **SwiftUI**. Here I share what I'm making, what I'm learning,
            and the occasional detour along the way.
            

  
  socialIcons:
    - name: instagram
      url: "https://www.instagram.com/tzyi.dev/"
    - name: itchio
      url: "https://tzyi.itch.io"
    - name: "rss"
      url: "https://www.tzyi.dev/index.xml"

